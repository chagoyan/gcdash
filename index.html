<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCDash — Google Classroom Dashboard</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Google Identity Services — required for OAuth -->
  <script src="https://accounts.google.com/gsi/client"></script>

  <!-- Config — not committed to git, auto-fills Client ID -->
  <script src="config.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="styles.css">
  <style>
    .gcdash-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #dadce0;
      border-top-color: #F26522;
      border-radius: 50%;
      animation: gcdash-spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes gcdash-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (orientation: portrait) and (max-width: 768px) {
      .col-earned {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Header -->
    <div class="header">
      <img src="logo.png" alt="CHS Technology Pathway" class="logo">
      <div>
        <h1>GCDash</h1>
        <p class="subtitle">Google Classroom Dashboard</p>
      </div>
      <a id="signout-btn" href="#" onclick="resetApp(); return false;"
        style="display:none;margin-left:auto;font-size:13px;color:#5f6368;text-decoration:none;">Sign out</a>
    </div>

    <!-- --------------------------------------------------------
       Setup Section
       Shown on first load. Hidden after successful login.
  --------------------------------------------------------- -->
    <div class="setup-box" id="setup-section">
      <h2>Google Classroom Dashboard</h2>
      <p style="font-size:13px;color:#5f6368;margin-bottom:1.25rem;">Connect your Google account to view course outlines,
        assignments, materials, and monitor student progress.</p>
      <button class="btn btn-primary" id="connect-btn" onclick="connectGoogle()">Connect with Google</button>
      <div class="token-note">Read-only access — your data never leaves your browser.</div>
      <div class="status" id="auth-status"></div>
    </div>

    <!-- --------------------------------------------------------
       Quick Links Panel
       Shown after login. Customizable daily resource links.
  --------------------------------------------------------- -->
    <div class="quick-links-section" id="quick-links-section" style="display:none;">
      <div class="quick-links-header">
        <h2>Quick Links</h2>
        <button class="btn" onclick="toggleAddLink()">+ Add Link</button>
      </div>
      <div class="add-link-form" id="add-link-form" style="display:none;">
        <input type="text" id="link-name" placeholder="Name (e.g. Aeries)" />
        <input type="text" id="link-url" placeholder="URL (e.g. https://...)" />
        <button class="btn btn-primary" onclick="saveNewLink()">Save</button>
        <button class="btn" onclick="toggleAddLink()">Cancel</button>
      </div>
      <div class="quick-links-grid" id="quick-links-grid"></div>
    </div>
    <div class="courses-section" id="courses-section">
      <div class="courses-header">
        <h2>Your courses</h2>
        <button class="btn" id="owned-toggle" onclick="toggleOwned()">Showing: My courses</button>
      </div>
      <div class="tabs" id="course-tabs"></div>
      <div id="course-tab-panels"></div>
      <div class="actions">
        <button class="btn btn-success" id="monitor-btn" onclick="monitorSelected()" disabled>Monitor student
          progress</button>
        <button class="btn btn-primary" id="fetch-btn" onclick="fetchSelected()" disabled>Fetch assignments &amp;
          materials</button>
        <button class="btn btn-primary" id="dl-all-btn" onclick="downloadAllMd()">Download all as .md</button>
        <a class="btn" id="seating-btn" href="seating.html" style="text-decoration:none;display:none;">Seating Chart</a>
      </div>
      <div class="status" id="fetch-status"></div>
    </div>

    <!-- --------------------------------------------------------
       Detail Section
       Shown after fetching a course. Displays topics,
       assignments, materials, and attachments.
  --------------------------------------------------------- -->
    <div class="detail-section" id="detail-section">
      <span class="detail-back" onclick="closeDetail()">← Back to courses</span>
      <h2 id="detail-title"></h2>
      <div id="detail-body"></div>
      <div class="actions" id="detail-actions">
        <button class="btn btn-primary" onclick="openPrintView('summary')">Print Summary Outline</button>
        <button class="btn btn-primary" onclick="openPrintView('detailed')">Print Detailed Outline</button>
        <button class="btn" onclick="downloadSelectedMd()">Download .md</button>
      </div>
    </div>

  </div><!-- end .container -->

  <!-- App logic -->
  <script src="app.js"></script>

</body>

</html>
